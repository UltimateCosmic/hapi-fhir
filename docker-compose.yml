version: "3"
services:
  # Nginx Gateway - Reverse Proxy
  nginx-gateway:
    image: nginx:alpine
    container_name: hapi-fhir-nginx-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - hapi-fhir-jpaserver-start
    networks:
      - hapi-network

  hapi-fhir-jpaserver-start:
    build: .
    container_name: hapi-fhir-jpaserver-start
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://hapi-fhir-postgres:5432/hapi"
      SPRING_DATASOURCE_USERNAME: "admin"
      SPRING_DATASOURCE_PASSWORD: "admin"
      SPRING_DATASOURCE_DRIVERCLASSNAME: "org.postgresql.Driver"
    # Port 8081 exposed for direct access if needed, but Nginx gateway is recommended
    ports:
      - "8081:8080"
    networks:
      - hapi-network
    depends_on:
      - hapi-fhir-postgres

  hapi-fhir-postgres:
    image: postgres:15-alpine
    container_name: hapi-fhir-postgres
    restart: always
    environment:
      POSTGRES_DB: "hapi"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "admin"
    volumes:
      - hapi-fhir-postgres:/var/lib/postgresql/data
    networks:
      - hapi-network

networks:
  hapi-network:
    driver: bridge

volumes:
  hapi-fhir-postgres:
  nginx-logs:
